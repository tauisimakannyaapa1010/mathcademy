
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi Belajar | Mathcademy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        .materials-page {
            padding: 32px;
        }

        .materials-header {
            margin-bottom: 28px;
        }

        .materials-header h1 {
            margin: 8px 0;
        }

        .materials-header p {
            color: #64748b;
        }

        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chapter-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
        }

        .chapter-heading {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .chapter-number {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: #ccfbf1;
            color: #0f766e;
            font-weight: 800;
        }

        .chapter-heading h2 {
            margin: 0 0 4px;
            font-size: 20px;
        }

        .chapter-heading p {
            margin: 0;
            color: #64748b;
            font-size: 13px;
        }

        .subchapter-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .subchapter-item {
            padding: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
        }

        .subchapter-item h3 {
            margin: 0 0 6px;
            font-size: 16px;
        }

        .subchapter-item p {
            margin: 0 0 12px;
            color: #64748b;
            font-size: 13px;
        }

        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .activity-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
        }

        .activity-item span {
            font-size: 14px;
            font-weight: 600;
        }

        .activity-button {
            border: none;
            border-radius: 8px;
            padding: 9px 14px;
            background: #0f766e;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .empty-message {
            color: #64748b;
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 12px;
        }

        /* PROGRES SUBBAB */
.subchapter-progress {
    margin: 16px 0;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 12px;
}

.progress-label {
    color: #64748b;
    font-weight: 600;
}

.progress-count {
    color: #365314;
    font-weight: 800;
}

.progress-track {
    width: 100%;
    height: 9px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #84cc16, #4d7c0f);
    border-radius: 20px;
    transition: width 0.4s ease;
}

/* STATUS AKTIVITAS */
.activity-status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
}

.activity-status.completed {
    color: #365314;
    background: #ecfccb;
}

.activity-status.locked {
    color: #64748b;
    background: #f1f5f9;
}

.activity-button {
    background: #4d7c0f;
    color: white;
    text-decoration: none;
    transition: 0.2s ease;
}

.activity-button:hover {
    background: #365314;
    transform: translateY(-1px);
}
/* Jarak progres keseluruhan BAB */
.chapter-progress {
    margin-top: 24px;
    margin-bottom: 22px;
}

.chapter-progress .progress-info {
    margin-bottom: 12px;
}

.chapter-progress .progress-track {
    height: 10px;
}
        @media (max-width: 768px) {
            .materials-page {
                padding: 20px 14px;
            }

            .activity-item {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="app">

        <aside class="sidebar">
            <a href="index.html" class="brand">
                <span class="brand-icon">∑</span>
                <span>mathcademy<span class="brand-dot">.</span></span>
            </a>

            <div class="menu-label">MENU UTAMA</div>
            <nav class="navigation">
                <a href="index.html" class="nav-item">
                    <span class="nav-icon">⌂</span> Dashboard
                </a>
                <a href="student-materials.html" class="nav-item active">
                    <span class="nav-icon">▤</span> Materi Belajar
                </a>
                <a href="index.html#latihan" class="nav-item">
                    <span class="nav-icon">✎</span> Latihan & Kuis
                </a>
                <a href="index.html#nilai" class="nav-item">
                    <span class="nav-icon">▥</span> Nilai Saya
                </a>
            </nav>

            <div class="sidebar-bottom">
                <a href="#" class="logout" id="logoutButton">
                    ↪ &nbsp; Keluar
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="breadcrumb">
                    Halaman / <strong>Materi Belajar</strong>
                </div>

                <div class="topbar-right">
                    <div class="profile">
                        <div class="avatar" id="studentAvatar">M</div>
                        <div>
                            <strong id="studentName">Nama Murid</strong>
                            <span>Siswa</span>
                        </div>
                    </div>
                </div>
            </header>

            <section class="materials-page">
                <div class="materials-header">
                    <p class="eyebrow">RUANG BELAJARMU</p>
                    <h1>Materi Pembelajaran</h1>
                    <p>Pilih BAB dan aktivitas untuk memulai perjalanan belajarmu.</p>
                </div>

                <div id="chapterList" class="chapter-list">
                    <div class="empty-message">Memuat materi pembelajaran...</div>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="js/student-materials.js"></script>
</body>
</html>
