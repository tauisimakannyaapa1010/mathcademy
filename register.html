
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun | Mathcademy</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #F0F7F1, #E2F0E5);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 16px;
        }

        .register-container {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 38px;
            border-radius: 22px;
            box-shadow: 0 12px 35px rgba(54, 83, 20, 0.08);
        }

        .brand {
            color: #6C9B76;
            font-size: 27px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 28px;
        }

        h1 {
            color: #365C43;
            font-size: 25px;
            margin: 0 0 10px;
        }

        .description {
            color: #737373;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        .form-group label {
            display: block;
            color: #365C43;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #D5E3D7;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #6C9B76;
            box-shadow: 0 0 0 3px #E7F2E9;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #6C9B76;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: #568361;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .message.error {
            display: block;
            background: #FEF2F2;
            color: #B91C1C;
        }

        .message.success {
            display: block;
            background: #ECFDF5;
            color: #166534;
        }

        .login-link {
            text-align: center;
            margin-top: 23px;
            font-size: 14px;
            color: #737373;
        }

        .login-link a {
            color: #568361;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .approval-note {
            margin-top: 22px;
            padding: 13px;
            background: #F0F7F1;
            border-radius: 10px;
            color: #52715A;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }

        @media (max-width: 500px) {
            .register-container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="brand">Mathcademy</div>

        <h1>Buat Akun Baru</h1>

        <p class="description">
            Daftarkan dirimu untuk mulai belajar matematika
            bersama Mathcademy.
        </p>

        <div id="message" class="message"></div>

        <form id="registerForm">

            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama lengkap"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="contoh@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Kata Sandi</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Minimal 8 karakter"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Konfirmasi Kata Sandi</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Ulangi kata sandi"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Daftar Sekarang
            </button>

        </form>

        <div class="approval-note">
            Setelah mendaftar, akunmu akan menunggu persetujuan
            guru sebelum dapat digunakan untuk mengakses
            pembelajaran Mathcademy.
        </div>

        <div class="login-link">
            Sudah punya akun?
            <a href="login.html">Masuk di sini</a>
        </div>

    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        const registerForm = document.getElementById('registerForm');
        const message = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
        }

        registerForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const fullName = document.getElementById('nama').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!fullName) {
                showMessage('Nama lengkap harus diisi.', 'error');
                return;
            }

            if (password.length < 8) {
                showMessage('Kata sandi minimal 8 karakter.', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('Konfirmasi kata sandi tidak cocok.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Memproses pendaftaran...';
            message.className = 'message';

            try {
               const { data, error } = await supabase.functions.invoke(
    'student-self-register',
    {
        body: {
            full_name: fullName,
            email: email,
            password: password
        }
    }
);

if (error) {
    throw error;
}

if (!data || !data.success) {
    throw new Error(
        data?.error || 'Pendaftaran belum berhasil. Silakan coba kembali.'
    );
}

                window.location.href = 'pending-approval.html';

            } catch (error) {
                console.error('Pendaftaran gagal:', error);

                showMessage(
                    error.message || 'Terjadi kesalahan saat mendaftar.',
                    'error'
                );

                submitBtn.disabled = false;
                submitBtn.textContent = 'Daftar Sekarang';
            }
        });
    </script>

</body>
</html>
